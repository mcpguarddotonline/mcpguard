[package]
name = "mcpguard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP-Guard command-line tool: scan, wrap and protect MCP servers locally"
homepage.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
mcpguard-engine = { version = "0.1.0", path = "../mcpguard-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[lints]
workspace = true

[[bin]]
name = "mcpguard"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
