[workspace]
resolver = "3"
members = ["crates/mcpguard-engine", "crates/mcpguard-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mcpguarddotonline/mcpguard"
homepage = "https://mcpguard.online"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
